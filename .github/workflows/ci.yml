name: CI

on:
  push:
    branches: [dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

  retrieval-eval:
    runs-on: ubuntu-latest
    environment: dev
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPEN_AI_BASE_URL }}
      LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ingest FAQ into Qdrant
        run: uv run ingest
        env:
          DESTINATION__QDRANT__QD_LOCATION: ${{ secrets.QDRANT_URL }}
          DESTINATION__QDRANT__CREDENTIALS__API_KEY: ${{ secrets.QDRANT_API_KEY }}

      - name: Run retrieval evaluation
        run: uv run eval-retrieval | tee retrieval-eval.txt

      - name: Publish metrics to job summary
        run: |
          {
            echo "### Retrieval metrics"
            echo '```'
            cat retrieval-eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
