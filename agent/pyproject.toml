[project]
name = "dlthub-workspace"
version = "0.1.0"
description = "A dlthub workspace"
requires-python = ">=3.13"
dependencies = [
    "dlt[hub]>=1.27.2,<2",
    "dlthub>=0.27.0,<1",
    "duckdb>=0.9",
    "ibis-framework>=12.0.0 ; python_version >= '3.10'",
    "pyarrow>=16.0.0",
    "fastmcp>=3.0.0 ; python_version >= '3.10'",
    "mowidgets>=0.2.1 ; python_version >= '3.11'",
    "pathspec>=0.11.2",
    "pydbml>=1.2.0",
    "croniter>=6.0.0",
]

[dependency-groups]

ci = [
    "ruff>=0.15.8,<0.16.0", # formating and linting
    "yamllint>=1.38.0,<1.39.0", # yaml linting
    "ty>=0.0.26,<0.0.27", # type checking
    "dlthub-client>=0.27.7,<1", # dlthub client
    ]

dev = [
    {include-group = "ci"},
    "prek",
    "marimo>=0.14.5",
]

[tool.uv]
default-groups = ["ci"]

[tool.ruff]
line-length = 130

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"