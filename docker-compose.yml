services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /readyz HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'ok' <&3"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python ingestion/faq_pipeline.py"
    environment:
      QDRANT_URL: http://qdrant:6333
      DESTINATION__QDRANT__QD_LOCATION: http://qdrant:6333
      DESTINATION__QDRANT__MODEL: ${QDRANT_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      GRANDLYON_STATIONS_URL: ${GRANDLYON_STATIONS_URL:-https://data.grandlyon.com/fr/datapusher/ws/rdata/jcd_jcdecaux.jcdvelov/all.json}
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_EMBEDDING_MODEL: ${QDRANT_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-velov_faq}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://opencode.ai/zen/v1/}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash-free}
      RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      GRANDLYON_STATIONS_URL: ${GRANDLYON_STATIONS_URL:-https://data.grandlyon.com/fr/datapusher/ws/rdata/jcd_jcdecaux.jcdvelov/all.json}
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
