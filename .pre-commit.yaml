repos:
  - repo: local
    hooks:
      - id: format
        name: "Ruff Format"
        entry: uv --directory app run ruff format
        language: system
        types: [python]
        files: ^(app|evaluation|ingestion)/.*\.py$
        pass_filenames: false
        stages: [pre-commit]

      - id: lint
        name: "Ruff Lint"
        entry: uv --directory app run ruff check --fix
        language: system
        types: [python]
        files: ^(app|evaluation|ingestion)/.*\.py$
        pass_filenames: false
        stages: [pre-commit]

      - id: type-check
        name: "Type Checking (ty)"
        entry: uv --directory app run ty
        language: system
        types: [python]
        files: ^(app|evaluation|ingestion)/.*\.py$
        pass_filenames: false
        stages: [pre-push]